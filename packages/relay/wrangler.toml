# DSHAnywhere 中转：使用者的 Cloudflare 账号自行部署
# 部署：cf deploy（在 packages/relay 目录内）或 npx wrangler deploy
name = "dsh-anywhere-relay"
main = "src/index.ts"
compatibility_date = "2025-01-15"
workers_dev = true

# v1：一台中转对应一台电脑，installId 取默认值即可
[vars]
DSH_INSTALL_ID = "e2e-8"

[[durable_objects.bindings]]
name = "RELAY_OBJECT"
class_name = "RelayObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayObject"]
